<!doctype html>
<html lang="en">
<head><script data-fndr="static-host">
(function(){
  window.FD_API_BASE="";window.FD_VIDEO_BASE="https://fndr.8nomads.com/v2/assets";window.FD_SITE_BASE="";
  // Framer CMS byte ranges on a plain file host: fetch the whole file once, hand back the slices asked for
  var f=window.fetch,cache={};
  window.fetch=function(u,o){
    try{
      var url=new URL(typeof u==="string"?u:u.url,location.href),ranges=url.searchParams.get("range");
      if(ranges&&/\.framercms$/.test(url.pathname)){
        var key=url.origin+url.pathname;
        var p=cache[key]||(cache[key]=f(key).then(function(r){if(!r.ok)throw new Error("cms "+r.status);return r.arrayBuffer()}));
        return p.then(function(buf){
          var b=new Uint8Array(buf),parts=[],n=0;
          ranges.split(",").forEach(function(r){var m=/^(\d+)-(\d+)$/.exec(r);if(!m)throw new Error("bad range");var s=b.subarray(+m[1],+m[2]+1);parts.push(s);n+=s.length});
          var out=new Uint8Array(n),off=0;parts.forEach(function(s){out.set(s,off);off+=s.length});
          return new Response(out,{status:200,headers:{"content-type":"application/octet-stream"}})
        })
      }
    }catch(e){}
    return f.apply(this,arguments)
  };
})();
</script>
